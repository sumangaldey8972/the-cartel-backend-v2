openapi: 3.1.0
info:
  title: The Cartel API
  version: 0.1.0
  description: Authentication and social feed API for The Cartel user application. MongoDB is the source of truth; Supabase broadcasts feed mutations to connected clients.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Feed
  - name: Feed interactions
  - name: Media
  - name: Tags
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Check API health
      responses:
        "200":
          description: API is available
  /api/v1/auth/sign-up:
    post:
      tags: [Authentication]
      summary: Create a user account
      description: Creates a pending USER account and emails a six-digit verification code that expires after five minutes. No session is issued until verification succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Pending account created and verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Verification email could not be delivered
  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify a pending account with its email OTP
      description: Activates the user and issues the session cookie after a valid, unused six-digit code is submitted within five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified and session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Code is incorrect, invalid, or expired
        "409":
          description: Email is already verified
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/resend-verification-otp:
    post:
      tags: [Authentication]
      summary: Request a new email verification OTP
      description: Invalidates the previous code. A generic response prevents account enumeration. Resends have a 60-second cooldown and database-backed hourly limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Generic resend result
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Verification email could not be delivered
  /api/v1/auth/sign-in:
    post:
      tags: [Authentication]
      summary: Sign in with an email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in and session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sign-out:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sign-out-everywhere:
    post:
      tags: [Authentication]
      summary: Revoke every session belonging to the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Return the current authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/feed/posts:
    get:
      tags: [Feed]
      summary: List published posts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: sort
          in: query
          schema: { type: string, enum: [latest, oldest, popular], default: latest }
        - name: tag
          in: query
          schema: { type: string, example: "#markets" }
        - name: author
          in: query
          schema: { type: string }
      responses:
        "200": { description: Paginated feed }
    post:
      tags: [Feed]
      summary: Publish a post
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostRequest" }
      responses:
        "201": { description: Post published }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/feed/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Feed]
      summary: Get one published post
      responses:
        "200": { description: Published post }
        "404": { description: Post not found }
    patch:
      tags: [Feed]
      summary: Update the signed-in user's post
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePostRequest" }
      responses:
        "200": { description: Post updated }
        "403": { description: Only the post author may update it }
    delete:
      tags: [Feed]
      summary: Soft-delete a post and clean its Cloudinary media
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Post deleted }
        "403": { description: Only the post author may delete it }
  /api/v1/feed/media/signature:
    post:
      tags: [Media]
      summary: Create a signed direct-upload request
      description: Returns a user-scoped Cloudinary signature and upload URL. Upload with XMLHttpRequest to expose client-side stream progress; the API never buffers the file.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Signed Cloudinary upload parameters }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/feed/posts/{postId}/likes:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags: [Feed interactions]
      summary: Like a post (idempotent)
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Like state and count }
    delete:
      tags: [Feed interactions]
      summary: Remove the signed-in user's like
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Like state and count }
  /api/v1/feed/posts/{postId}/comments:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Feed interactions]
      summary: List post comments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Paginated comments }
    post:
      tags: [Feed interactions]
      summary: Comment on a post or reply to a comment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201": { description: Comment published }
  /api/v1/feed/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Feed interactions]
      summary: Update the signed-in user's comment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Comment updated }
    delete:
      tags: [Feed interactions]
      summary: Soft-delete the signed-in user's comment
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Comment deleted }
  /api/v1/feed/posts/{postId}/shares:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      tags: [Feed interactions]
      summary: Share a post (idempotent)
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Share state and count }
    delete:
      tags: [Feed interactions]
      summary: Remove the signed-in user's share
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Share state and count }
  /api/v1/feed/tags:
    get:
      tags: [Tags]
      summary: Search or list trending inline hashtags
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200": { description: Tags ordered by usage and recency }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cartel_session
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SignUpRequest:
      type: object
      required: [firstName, lastName, username, email, password]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50, example: Suman }
        lastName: { type: string, minLength: 1, maxLength: 50, example: Dey }
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[a-z0-9_]+$", example: sumandey }
        email: { type: string, format: email, example: suman@example.com }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    SignInRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, example: suman@example.com }
        password: { type: string, format: password }
    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email, example: suman@example.com }
        otp: { type: string, pattern: "^[0-9]{6}$", example: "123456" }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: suman@example.com }
    User:
      type: object
      required: [id, firstName, lastName, username, email, roles, status]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [USER, PUBLISHER, ADVERTISER, MODERATOR, ADMIN, SUPER_ADMIN]
        status: { type: string, enum: [ACTIVE, PENDING, SUSPENDED] }
        emailVerifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    UserResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
    MediaAsset:
      type: object
      required: [publicId, secureUrl, resourceType]
      properties:
        publicId: { type: string }
        secureUrl: { type: string, format: uri }
        resourceType: { type: string, enum: [image, video] }
        format: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, minimum: 0 }
        duration: { type: number, minimum: 0 }
        altText: { type: string, maxLength: 1000 }
        taggedPeople:
          type: array
          items: { type: string }
        madeWithAi: { type: boolean, default: false }
        cropAspect: { type: string, enum: [original, "1 / 1", "16 / 9", "4 / 5"], default: original }
        cropX: { type: number, minimum: 0, maximum: 100, default: 50 }
        cropY: { type: number, minimum: 0, maximum: 100, default: 50 }
        zoom: { type: number, minimum: 1, maximum: 2.5, default: 1 }
    CreatePostRequest:
      type: object
      description: Hashtags are extracted from content server-side; do not send a separate tags field.
      properties:
        content: { type: string, maxLength: 1000, example: "Market outlook\n\n#markets #btc" }
        media:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/MediaAsset" }
        replyPermission: { type: string, enum: [EVERYONE, FOLLOWING, MENTIONED], default: EVERYONE }
    UpdatePostRequest:
      type: object
      minProperties: 1
      properties:
        content: { type: string, maxLength: 1000 }
        media:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/MediaAsset" }
        replyPermission: { type: string, enum: [EVERYONE, FOLLOWING, MENTIONED] }
    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        parentCommentId: { type: string }
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Authentication failed or is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Email or username already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Verification attempts or delivery requests exceeded their limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
